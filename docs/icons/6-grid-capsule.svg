<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13909a"/><stop offset="1" stop-color="#0a5960"/></linearGradient></defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- microarray spots, red = up, blue = down -->
  <g>
    <circle cx="230" cy="230" r="44" fill="#fff" opacity=".28"/><circle cx="380" cy="230" r="44" fill="#f26b5f"/><circle cx="530" cy="230" r="44" fill="#fff" opacity=".28"/><circle cx="680" cy="230" r="44" fill="#7fb0ff"/>
    <circle cx="230" cy="380" r="44" fill="#7fb0ff"/><circle cx="380" cy="380" r="44" fill="#f26b5f"/><circle cx="530" cy="380" r="44" fill="#fff" opacity=".28"/><circle cx="680" cy="380" r="44" fill="#fff" opacity=".28"/>
    <circle cx="230" cy="530" r="44" fill="#fff" opacity=".28"/><circle cx="380" cy="530" r="44" fill="#f26b5f"/>
    <circle cx="230" cy="680" r="44" fill="#7fb0ff"/>
  </g>
  <!-- capsule overlapping the lower right -->
  <g transform="rotate(-45 660 660)">
    <rect x="560" y="430" width="200" height="460" rx="100" fill="#ffffff"/>
    <path d="M560 660 V530 a100 100 0 0 1 200 0 V660 Z" fill="#e2493d"/>
    <rect x="560" y="430" width="200" height="460" rx="100" fill="none" stroke="#0a5960" stroke-width="22"/>
    <line x1="560" y1="660" x2="760" y2="660" stroke="#0a5960" stroke-width="18"/>
  </g>
</svg>
