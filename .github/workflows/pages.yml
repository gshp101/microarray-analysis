# Publishes the PathRx web app (web/) to GitHub Pages on every push to main.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Web app (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["web/**", "src/pathrx/**", "docs/tutorial.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python web/build.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
