[project]
name = "pathrx"
version = "0.2.0"
description = "Find metabolic pathways affected in public gene expression microarray studies"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["gseapy", "matplotlib", "numpy", "pandas", "requests", "scipy", "statsmodels"]

[project.optional-dependencies]
dev = ["pytest"]
desktop = ["PySide6>=6.5"]

[project.scripts]
pathrx = "pathrx.cli:main"

[project.gui-scripts]
pathrx-desktop = "pathrx.desktop.app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pathrx = ["benchmarks/*.tsv", "desktop/icons/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
